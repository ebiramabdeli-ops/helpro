services:
  # PostgreSQL Database for Backend
  postgres:
    image: postgres:16-alpine
    container_name: helpro-postgres
    environment:
      POSTGRES_DB: helpro
      POSTGRES_USER: helpro
      POSTGRES_PASSWORD: helpro_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - helpro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpro"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpro-backend
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: helpro
      DATABASE_PASSWORD: helpro_password
      DATABASE_NAME: helpro
      JWT_SECRET: your-secret-key-change-in-production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - helpro-network
    restart: unless-stopped

  # Node.js Express Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: helpro-server
    environment:
      NODE_ENV: production
      PORT: 8080
      JWT_SECRET: your-secret-key-change-in-production
    volumes:
      - server_data:/app/data
    ports:
      - "8080:8080"
    networks:
      - helpro-network
    restart: unless-stopped

  # AI Python Service
  ai-service:
    build:
      context: ./ai-python
      dockerfile: Dockerfile
    container_name: helpro-ai-service
    environment:
      PYTHONUNBUFFERED: 1
      PORT: 8000
    ports:
      - "8000:8000"
    networks:
      - helpro-network
    restart: unless-stopped

  # Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpro-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - server
      - ai-service
    networks:
      - helpro-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  server_data:
    driver: local

networks:
  helpro-network:
    driver: bridge
